; DeepSentinel Query Runner
;
; Copy this file to config.ini and edit. config.ini is gitignored — it holds a
; database password and must never be committed.
;
; Everything here can also be set from the Settings panel in the interface.

[DATABASE]
; sqlite   — a local file on this laptop. Good for trying things out.
; postgres — a shared server such as Neon. Required if more than one person or
;            more than one worker uses the database at the same time.
kind = sqlite

; Used when kind = sqlite
sqlite_path = ./deepsentinel_runner.db

; Used when kind = postgres
host =
port = 5432
name =
user =
password =
sslmode = require

[REPLAY]
; Rows pushed into the live queue per second. The point is to look like
; arriving traffic, not a bulk load, so the detectors have something to react
; to continuously.
rows_per_second = 5

; Rows read from the file at a time.
batch_size = 50

; A shared folder — typically a Drive for Desktop mount. Files here are read in
; place, so a large extract does not have to be uploaded by each person.
; macOS example:
;   /Users/you/Library/CloudStorage/GoogleDrive-you@gmail.com/My Drive/DeepSentinel
; Windows example:
;   G:\My Drive\DeepSentinel
watch_folder =
